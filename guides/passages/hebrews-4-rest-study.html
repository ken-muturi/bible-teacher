<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hebrews 4 — The Rest (Deep Study)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400;1,700&display=swap');
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#f5f0e8; --bg:#faf7f2; --ink:#2c2c2c; --muted:#5a5a5a;
  --blue:#3b6fd4; --green:#2e8a4a; --red:#c0392b; --orange:#d47c1a; --purple:#6c4bbf;
  --blue-t:#e8eefb; --green-t:#e5f3e9; --red-t:#f8e6e3; --orange-t:#fbeedd; --purple-t:#eeeafa;
  --darkbox:#1a1a1a; --darktext:#f5f0e8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#17150f; --bg:#201d16; --ink:#efe9dc; --muted:#b9b2a2;
    --blue:#7da2ee; --green:#6cc287; --red:#e9806f; --orange:#eba85a; --purple:#a58ee6;
    --blue-t:#1f2a44; --green-t:#1c3324; --red-t:#43211d; --orange-t:#44301a; --purple-t:#2d2646;
    --darkbox:#0c0b08; --darktext:#efe9dc;
  }
}
:root[data-theme="dark"]{
  --page:#17150f; --bg:#201d16; --ink:#efe9dc; --muted:#b9b2a2;
  --blue:#7da2ee; --green:#6cc287; --red:#e9806f; --orange:#eba85a; --purple:#a58ee6;
  --blue-t:#1f2a44; --green-t:#1c3324; --red-t:#43211d; --orange-t:#44301a; --purple-t:#2d2646;
  --darkbox:#0c0b08; --darktext:#efe9dc;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-family:'Gentium Book Plus',Georgia,'Times New Roman',serif;font-size:17px;line-height:1.55}
.wrap{max-width:900px;margin:0 auto;padding:14px 14px 40px}
.panel{background:var(--bg);border:3px solid var(--ink);border-radius:3px;padding:16px}
h1,h2,h3{margin:0}
.title{border:2.5px solid var(--ink);border-radius:3px;padding:12px 14px;margin-bottom:14px;background:var(--bg)}
.title .ref{font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.title h1{font-size:28px;letter-spacing:.12em;text-transform:uppercase;margin:4px 0}
.title .one{font-style:italic}
.sec{margin:20px 0 8px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.callout{border-left:5px solid var(--blue);padding:8px 12px;margin:8px 0;background:var(--blue-t)}
.callout .cite{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--blue)}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}
.card{border:2.5px solid var(--ink);border-radius:3px;padding:10px 12px;background:var(--bg)}
.card h3{font-size:18px}
.card .tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.blue{border-color:var(--blue);background:var(--blue-t)} .blue .tag{color:var(--blue)}
.green{border-color:var(--green);background:var(--green-t)} .green .tag{color:var(--green)}
.red{border-color:var(--red);background:var(--red-t)} .red .tag{color:var(--red)}
.orange{border-color:var(--orange);background:var(--orange-t)} .orange .tag{color:var(--orange)}
.purple{border-color:var(--purple);background:var(--purple-t)} .purple .tag{color:var(--purple)}
.gk{font-size:20px;font-weight:700}
.tr{font-style:italic;color:var(--muted)}
.row{margin:6px 0}
.lab{font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.beat{display:flex;gap:10px;align-items:stretch;margin:6px 0}
.beat .rng{flex:0 0 92px;font-weight:700;font-size:14px;border:2.5px solid;border-radius:3px;padding:6px;text-align:center}
.beat .txt{flex:1;border:2.5px solid;border-radius:3px;padding:6px 10px}
.dark{background:var(--darkbox);color:var(--darktext);border-radius:3px;padding:14px 16px;margin:8px 0}
.dark h3{font-size:14px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
.dark p{margin:6px 0}
.verdict{border:3px solid var(--ink);border-radius:3px;text-align:center;padding:18px 14px;margin-top:20px}
.verdict .big{font-size:21px;font-weight:700}
.verify{font-size:13px;font-weight:700;color:var(--red)}
.src{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
a{color:var(--blue)}
.flag{font-size:14px;color:var(--muted);font-style:italic}
@media (max-width:640px){
  .g2{grid-template-columns:1fr}
  .beat{flex-direction:column;gap:4px}
  .beat .rng{flex:none}
  .title h1{font-size:23px}
}
</style>
</head>

<div class="wrap">

<div class="title">
